<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Packages</title>

<style>
body{
margin:0;
font-family:Arial;
background:linear-gradient(to bottom,#06142e,#020d1f);
color:white;
padding:15px;
padding-bottom:120px;
}

.section{
margin-bottom:40px;
}

.section h2{
color:#00e0ff;
font-size:22px;
margin-bottom:20px;
}

.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:20px;
}

.card{
background:#0d1b3d;
padding:15px;
border-radius:15px;
border:2px solid white;
box-shadow:0 5px 15px rgba(0,0,0,0.4);
text-align:center;
transition:0.3s;
}

.card:hover{
box-shadow:0 0 15px rgba(255,255,255,0.7);
transform:scale(1.02);
}

.card img{
width:80px;
height:80px;
object-fit:contain;
border-radius:10px;
margin-bottom:8px;
}

.card h3{
font-size:13px;
margin-bottom:8px;
}

.price{
font-size:14px;
font-weight:bold;
margin-bottom:10px;
}

.counter{
display:flex;
justify-content:center;
align-items:center;
gap:10px;
background:#08142e;
padding:6px;
border-radius:40px;
}

.counter button{
background:#00c2d1;
border:none;
color:white;
width:30px;
height:30px;
border-radius:50%;
font-size:16px;
cursor:pointer;
}

.counter span{
font-size:16px;
}

.bottom-bar{
position:fixed;
bottom:10px;
left:10px;
right:10px;
background:#000;
border-radius:30px;
display:flex;
justify-content:space-between;
align-items:center;
padding:12px 18px;
box-shadow:0 10px 20px rgba(0,0,0,0.6);
}

.total{
font-size:16px;
font-weight:bold;
}

.next-btn{
background:black;
color:white;
border:3px solid;
padding:10px 24px;
border-radius:30px;
font-weight:bold;
cursor:pointer;
animation: borderMove 4s infinite;
}

@keyframes borderMove{
0%{border-color:green;}
25%{border-color:blue;}
50%{border-color:red;}
75%{border-color:yellow;}
100%{border-color:green;}
}

.next-btn:hover{
background:#00c2d1;
color:black;
}
</style>
</head>
<body>

<div id="products"></div>

<div class="bottom-bar">
<div class="total" id="total">Total: 0 LKR</div>
<button class="next-btn" onclick="goCheckout()">NEXT</button>
</div>

<script>
const sections = [

{
title:"MEMBERSHIP",
items:[
["WEEKLY LITE MEMBERSHIP",130],
["WEEKLY MEMBERSHIP",520],
["MONTHLY MEMBERSHIP",2560],
["VIP MEMBERSHIP",3080],
["VIP PLUS MEMBERSHIP",3210],
["S VIP MEMBERSHIP",4640],
["S VIP PLUS MEMBERSHIP",5160]
]
},

{
title:"DAIOMED PACK",
items:[
["25 💎",100],["50 💎",200],["75 💎",300],["100 💎",400],
["150 💎",600],["200 💎",800],["310 💎",950],["350 💎",1400],
["520 💎",1580],["830 💎",2530],["1060 💎",3020],["2180 💎",6020],
["3240 💎",9040],["5600 💎",14700],["6660 💎",17720],["8840 💎",23740],
["11500 💎",31000],["15500 💎",41460],["23000 💎",61000],["46000 💎",124000]
]
},

{
title:"LEVEL UP PASS PACKAGE",
items:[
["LEVEL 6",180],
["LEVEL 10",300],
["LEVEL 15",300],
["LEVEL 20",300],
["LEVEL 25",300],
["LEVEL 30",450]
]
},

{
title:"EVO ACCESS PACKAGE",
items:[
["EVO ACCESS — 3 DAY",200],
["EVO ACCESS — 7 DAY",350],
["EVO ACCESS — 30 DAY",900]
]
}

];

let container = document.getElementById("products");
let cart = {};
let index = 0;

// Item-level images mapping
const itemImages = {
  "WEEKLY LITE MEMBERSHIP": "images/weekly_lite.png",
  "WEEKLY MEMBERSHIP": "images/weekly.png",
  "MONTHLY MEMBERSHIP": "images/monthly.png",
  "VIP MEMBERSHIP": "images/vip.png",
  "VIP PLUS MEMBERSHIP": "images/vip_plus.png",
  "S VIP MEMBERSHIP": "images/s_vip.png",
  "S VIP PLUS MEMBERSHIP": "images/s_vip_plus.png",
  "25 💎": "images/25.png",
  "50 💎": "images/50.png",
  "75 💎": "images/75.png",
  "100 💎": "images/100.png",
  "150 💎": "images/150.png",
  "200 💎": "images/200.png",
  "310 💎": "images/310.png",
  "350 💎": "images/350.png",
  "520 💎": "images/520.png",
  "830 💎": "images/830.png",
  "1060 💎": "images/1060.png",
  "2180 💎": "images/2180.png",
  "3240 💎": "images/3240.png",
  "5600 💎": "images/5600.png",
  "6660 💎": "images/6660.png",
  "8840 💎": "images/8840.png",
  "11500 💎": "images/11500.png",
  "15500 💎": "images/15500.png",
  "23000 💎": "images/23000.png",
  "46000 💎": "images/46000.png",
  "LEVEL 6": "images/level6.png",
  "LEVEL 10": "images/level10.png",
  "LEVEL 15": "images/level15.png",
  "LEVEL 20": "images/level20.png",
  "LEVEL 25": "images/level25.png",
  "LEVEL 30": "images/level30.png",
  "EVO ACCESS — 3 DAY": "images/evo3.png",
  "EVO ACCESS — 7 DAY": "images/evo7.png",
  "EVO ACCESS — 30 DAY": "images/evo30.png",
};

sections.forEach(section=>{
container.innerHTML += `<div class="section"><h2>${section.title}</h2><div class="grid">`;

section.items.forEach(item=>{
  let imgUrl = itemImages[item[0]] || "images/default.png";
  container.innerHTML += `
  <div class="card">
    <img src="${imgUrl}" alt="${item[0]}">
    <h3>${item[0]}</h3>
    <div class="price">LKR ${item[1]}</div>
    <div class="counter">
      <button onclick="change(${index},-1)">-</button>
      <span id="q${index}">0</span>
      <button onclick="change(${index},1)">+</button>
    </div>
  </div>
  `;
  cart[index]=0;
  index++;
});

container.innerHTML += `</div></div>`;
});

function change(i,val){
let q=document.getElementById("q"+i);
let qty=parseInt(q.innerText);
qty+=val;
if(qty<0) qty=0;
q.innerText=qty;
cart[i]=qty;
updateTotal();
}

function updateTotal(){
let total=0;
let i=0;

sections.forEach(section=>{
section.items.forEach(item=>{
total += cart[i]*item[1];
i++;
});
});

document.getElementById("total").innerText="Total: "+total+" LKR";
}

function goCheckout(){
let hasItem = false;
for(let i in cart){
if(cart[i] > 0){
hasItem = true;
break;
}
}
if(!hasItem){
alert("Please select top up pack!");
return;
}
localStorage.setItem("cart",JSON.stringify(cart));
localStorage.setItem("items",JSON.stringify(
sections.flatMap(section => section.items)
));
location.href="checkout.html";
}
</script>

</body>
</html>
