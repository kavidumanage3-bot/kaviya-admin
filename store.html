<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Packages</title>

<style>
body{
  margin:0;
  font-family:Arial;
  color:white;
  padding:15px;
  padding-bottom:140px;
  text-align:center;

  /* Background image full page */
  background-image: url('IMG-20260226-WA0091.jpg'); /* <-- Replace this with your background image path */
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
}

/* Optional: overlay to make content readable */
body::before{
  content:"";
  position:fixed;
  top:0; left:0; right:0; bottom:0;
  background: rgba(0,0,0,0.6); /* semi-transparent dark overlay */
  z-index:-1;
}

.store-title{
  color:white;
  font-size:28px;
  font-weight:bold;
  margin-bottom:25px;
}

.section{
  margin-bottom:40px;
  text-align:left;
}

.section h2{
  color:#00e0ff;
  font-size:22px;
  margin-bottom:20px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:20px;
}

.card{
  background: rgba(0,0,0,0.7);
  padding:20px;
  border-radius:15px;
  border:2px solid #ffffff;
  box-shadow:0 5px 15px rgba(255,255,255,0.1);
  text-align:center;
  transition:0.3s;
}

.card:hover{
  box-shadow:0 0 20px rgba(255,255,255,0.5);
  transform:scale(1.03);
}

.card img{
  width:120px;
  height:120px;
  object-fit:contain;
  border-radius:10px;
  margin-bottom:10px;
}

.card h3{
  font-size:16px;
  margin-bottom:10px;
}

.price{
  font-size:18px;
  font-weight:bold;
  margin-bottom:12px;
}

.counter{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:12px;
  background:#111111;
  padding:6px 10px;
  border-radius:40px;
}

.counter button{
  background:#00c2d1;
  border:none;
  color:white;
  width:35px;
  height:35px;
  border-radius:50%;
  font-size:18px;
  cursor:pointer;
}

.counter span{
  font-size:18px;
  min-width:25px;
  text-align:center;
}

.bottom-bar{
  position:fixed;
  bottom:10px;
  left:10px;
  right:10px;
  background:rgba(0,0,0,0.7);
  border-radius:30px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px 20px;
  box-shadow:0 10px 25px rgba(255,255,255,0.1);
}

.total{
  font-size:18px;
  font-weight:bold;
}

.next-btn{
  background:black;
  color:white;
  border:3px solid;
  padding:10px 24px;
  border-radius:30px;
  font-weight:bold;
  cursor:pointer;
  animation: borderMove 4s infinite;
}

@keyframes borderMove{
  0%{border-color:green;}
  25%{border-color:blue;}
  50%{border-color:red;}
  75%{border-color:yellow;}
  100%{border-color:green;}
}

.next-btn:hover{
  background:#00c2d1;
  color:black;
}
</style>
</head>
<body>

<div class="store-title">KAVIYA DIAMOND STORE</div>

<div id="products"></div>

<div class="bottom-bar">
  <div class="total" id="total">Total: 0 LKR</div>
  <button class="next-btn" onclick="goCheckout()">NEXT</button>
</div>

<script>
const sections = [
  {
    title:"MEMBERSHIP",
    items:[
      ["WEEKLY LITE MEMBERSHIP",130],
      ["WEEKLY MEMBERSHIP",520],
      ["MONTHLY MEMBERSHIP",2560],
      ["VIP MEMBERSHIP",3080],
      ["VIP PLUS MEMBERSHIP",3210],
      ["S VIP MEMBERSHIP",4640],
      ["S VIP PLUS MEMBERSHIP",5160]
    ]
  },
  {
    title:"DIAMOND PACK",
    items:[
      ["25 💎",100],["50 💎",200],["75 💎",300],["100 💎",400],
      ["150 💎",600],["200 💎",800],["310 💎",950],["350 💎",1400],
      ["520 💎",1580],["830 💎",2530],["1060 💎",3020],["2180 💎",6020],
      ["3240 💎",9040],["5600 💎",14700],["6660 💎",17720],
      ["8840 💎",23740],["11500 💎",31000],["15500 💎",41460],
      ["23000 💎",61000],["46000 💎",124000]
    ]
  },
  {
    title:"LEVEL UP PASS PACKAGE",
    items:[
      ["LEVEL 6",180],["LEVEL 10",300],["LEVEL 15",300],
      ["LEVEL 20",300],["LEVEL 25",300],["LEVEL 30",450]
    ]
  },
  {
    title:"EVO ACCESS PACKAGE",
    items:[
      ["EVO ACCESS — 3 DAY",200],
      ["EVO ACCESS — 7 DAY",350],
      ["EVO ACCESS — 30 DAY",900]
    ]
  }
];

let container = document.getElementById("products");
let cart = {};
let index = 0;

// Images map
const itemImages = {
  "WEEKLY LITE MEMBERSHIP":"3ezFGJgnumUR3SqEjz3cAJBi4J7nEG9fla2myobY.png",
  "WEEKLY MEMBERSHIP":"oss-a4dc82551f55d986ea4bab3e8521c172.png",
  "MONTHLY MEMBERSHIP":"xF6FE1FBC-FF48-4B7F-A381-C33FC06934AC-430x430.png.pagespeed.ic.phNjUfd3rU.png",
  "VIP MEMBERSHIP":"F40FBC28-383D-47E5-ADBC-82C12FB39773-430x430.png",
  "VIP PLUS MEMBERSHIP":"F40FBC28-383D-47E5-ADBC-82C12FB39773-430x430.png",
  "S VIP MEMBERSHIP":"F40FBC28-383D-47E5-ADBC-82C12FB39773-430x430.png",
  "S VIP PLUS MEMBERSHIP":"F40FBC28-383D-47E5-ADBC-82C12FB39773-430x430.png",
  "25 💎":"untitled-2025-09-21T105937.573.jpg","50 💎":"untitled-2025-09-21T105937.573.jpg",
  "75 💎":"untitled-2025-09-21T105937.573.jpg","100 💎":"untitled-2025-09-21T105937.573.jpg",
  "150 💎":"untitled-2025-09-21T105937.573.jpg","200 💎":"untitled-2025-09-21T105937.573.jpg",
  "310 💎":"untitled-2025-09-21T105937.573.jpg","350 💎":"untitled-2025-09-21T105937.573.jpg",
  "520 💎":"untitled-2025-09-21T105937.573.jpg","830 💎":"untitled-2025-09-21T105937.573.jpg",
  "1060 💎":"untitled-2025-09-21T105937.573.jpg","2180 💎":"untitled-2025-09-21T105937.573.jpg",
  "3240 💎":"untitled-2025-09-21T105937.573.jpg","5600 💎":"untitled-2025-09-21T105937.573.jpg",
  "6660 💎":"untitled-2025-09-21T105937.573.jpg","8840 💎":"untitled-2025-09-21T105937.573.jpg",
  "11500 💎":"untitled-2025-09-21T105937.573.jpg","15500 💎":"untitled-2025-09-21T105937.573.jpg",
  "23000 💎":"untitled-2025-09-21T105937.573.jpg","46000 💎":"untitled-2025-09-21T105937.573.jpg",
  "LEVEL 6":"IMG_20260223_234328_528.jpg","LEVEL 10":"IMG_20260223_234328_528.jpg",
  "LEVEL 15":"IMG_20260223_234328_528.jpg","LEVEL 20":"IMG_20260223_234328_528.jpg",
  "LEVEL 25":"IMG_20260223_234328_528.jpg","LEVEL 30":"IMG_20260223_234328_528.jpg",
  "EVO ACCESS — 3 DAY":"IMG_20260223_234325_627.jpg","EVO ACCESS — 7 DAY":"IMG_20260223_234325_627.jpg",
  "EVO ACCESS — 30 DAY":"IMG_20260223_234325_627.jpg"
};

sections.forEach(section=>{
  container.innerHTML += `<div class="section"><h2>${section.title}</h2><div class="grid">`;
  section.items.forEach(item=>{
    let imgUrl = itemImages[item[0]] || "images/default.png";
    container.innerHTML += `
      <div class="card">
        <img src="${imgUrl}" alt="${item[0]}">
        <h3>${item[0]}</h3>
        <div class="price">LKR ${item[1]}</div>
        <div class="counter">
          <button onclick="change(${index},-1)">-</button>
          <span id="q${index}">0</span>
          <button onclick="change(${index},1)">+</button>
        </div>
      </div>
    `;
    cart[index]=0;
    index++;
  });
  container.innerHTML += `</div></div>`;
});

function change(i,val){
  let q=document.getElementById("q"+i);
  let qty=parseInt(q.innerText);
  qty+=val;
  if(qty<0) qty=0;
  q.innerText=qty;
  cart[i]=qty;
  updateTotal();
}

function updateTotal(){
  let total=0;
  let i=0;
  sections.forEach(section=>{
    section.items.forEach(item=>{
      total += cart[i]*item[1];
      i++;
    });
  });
  document.getElementById("total").innerText="Total: "+total+" LKR";
}

function goCheckout(){
  let hasItem = false;
  for(let i in cart){
    if(cart[i] > 0){
      hasItem = true;
      break;
    }
  }
  if(!hasItem){
    alert("Please select top up pack!");
    return;
  }
  localStorage.setItem("cart",JSON.stringify(cart));
  localStorage.setItem("items",JSON.stringify(sections.flatMap(section => section.items)));
  location.href="checkout.html";
}
</script>

</body>
</html>
