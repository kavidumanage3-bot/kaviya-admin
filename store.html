<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Packages</title>

<style>
body{
  margin:0;
  font-family:Arial;
  color:white;
  padding:15px;
  padding-bottom:140px;
  text-align:center;
  /* Full page background image */
  background-image: url('diamond-clipart-design-illustration-free-png.png'); /* <- replace with your image path */
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
}

body::before{
  content:"";
  position:fixed;
  top:0; left:0; right:0; bottom:0;
  background: rgba(0,0,0,0.6); /* dark overlay for readability */
  z-index:-1;
}

.store-title{
  color:white;
  font-size:28px;
  font-weight:bold;
  margin-bottom:25px;
}

.section{
  margin-bottom:40px;
  text-align:left;
}

.section h2{
  color:#00e0ff;
  font-size:22px;
  margin-bottom:20px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:20px;
}

.card{
  background:rgba(0,0,0,0.7);
  padding:20px;
  border-radius:15px;
  border:2px solid #ffffff;
  box-shadow:0 5px 15px rgba(255,255,255,0.1);
  text-align:center;
  transition:0.3s;
}

.card:hover{
  box-shadow:0 0 20px rgba(255,255,255,0.5);
  transform:scale(1.03);
}

.card img{
  width:120px;
  height:120px;
  object-fit:contain;
  border-radius:10px;
  margin-bottom:10px;
}

.card h3{
  font-size:16px;
  margin-bottom:10px;
}

.price{
  font-size:18px;
  font-weight:bold;
  margin-bottom:12px;
}

.counter{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:12px;
  background:#111111;
  padding:6px 10px;
  border-radius:40px;
}

.counter button{
  background:#00c2d1;
  border:none;
  color:white;
  width:35px;
  height:35px;
  border-radius:50%;
  font-size:18px;
  cursor:pointer;
}

.counter span{
  font-size:18px;
  min-width:25px;
  text-align:center;
}

.bottom-bar{
  position:fixed;
  bottom:10px;
  left:10px;
  right:10px;
  background:rgba(0,0,0,0.7);
  border-radius:30px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px 20px;
  box-shadow:0 10px 25px rgba(255,255,255,0.1);
}

.total{
  font-size:18px;
  font-weight:bold;
}

.next-btn{
  background:black;
  color:white;
  border:3px solid;
  padding:10px 24px;
  border-radius:30px;
  font-weight:bold;
  cursor:pointer;
  animation: borderMove 4s infinite;
}

@keyframes borderMove{
  0%{border-color:green;}
  25%{border-color:blue;}
  50%{border-color:red;}
  75%{border-color:yellow;}
  100%{border-color:green;}
}

.next-btn:hover{
  background:#00c2d1;
  color:black;
}
</style>
</head>
<body>

<div class="store-title">KAVIYA DIAMOND STORE</div>

<div id="products"></div>

<div class="bottom-bar">
  <div class="total" id="total">Total: 0 LKR</div>
  <button class="next-btn" onclick="goCheckout()">NEXT</button>
</div>

<script>
const sections = [
  {
    title:"MEMBERSHIP",
    items:[
      ["WEEKLY LITE MEMBERSHIP",130,"img/membership/weekly_lite.png"],
      ["WEEKLY MEMBERSHIP",520,"img/membership/weekly.png"],
      ["MONTHLY MEMBERSHIP",2560,"img/membership/monthly.png"],
      ["VIP MEMBERSHIP",3080,"img/membership/vip.png"],
      ["VIP PLUS MEMBERSHIP",3210,"img/membership/vip_plus.png"],
      ["S VIP MEMBERSHIP",4640,"img/membership/s_vip.png"],
      ["S VIP PLUS MEMBERSHIP",5160,"img/membership/s_vip_plus.png"]
    ]
  },
  {
    title:"DIAMOND PACK",
    items:[
      ["25 💎",100,"img/diamonds/25.png"],
      ["50 💎",200,"img/diamonds/50.png"],
      ["75 💎",300,"img/diamonds/75.png"],
      ["100 💎",400,"img/diamonds/100.png"],
      ["150 💎",600,"img/diamonds/150.png"],
      ["200 💎",800,"img/diamonds/200.png"],
      ["310 💎",950,"img/diamonds/310.png"],
      ["350 💎",1400,"img/diamonds/350.png"],
      ["520 💎",1580,"img/diamonds/520.png"],
      ["830 💎",2530,"img/diamonds/830.png"],
      ["1060 💎",3020,"img/diamonds/1060.png"],
      ["2180 💎",6020,"img/diamonds/2180.png"],
      ["3240 💎",9040,"img/diamonds/3240.png"],
      ["5600 💎",14700,"img/diamonds/5600.png"],
      ["6660 💎",17720,"img/diamonds/6660.png"],
      ["8840 💎",23740,"img/diamonds/8840.png"],
      ["11500 💎",31000,"img/diamonds/11500.png"],
      ["15500 💎",41460,"img/diamonds/15500.png"],
      ["23000 💎",61000,"img/diamonds/23000.png"],
      ["46000 💎",124000,"img/diamonds/46000.png"]
    ]
  },
  {
    title:"LEVEL UP PASS PACKAGE",
    items:[
      ["LEVEL 6",180,"img/levelup/level6.png"],
      ["LEVEL 10",300,"img/levelup/level10.png"],
      ["LEVEL 15",300,"img/levelup/level15.png"],
      ["LEVEL 20",300,"img/levelup/level20.png"],
      ["LEVEL 25",300,"img/levelup/level25.png"],
      ["LEVEL 30",450,"img/levelup/level30.png"]
    ]
  },
  {
    title:"EVO ACCESS PACKAGE",
    items:[
      ["EVO ACCESS — 3 DAY",200,"img/evo/evo3.png"],
      ["EVO ACCESS — 7 DAY",350,"img/evo/evo7.png"],
      ["EVO ACCESS — 30 DAY",900,"img/evo/evo30.png"]
    ]
  }
];

let container = document.getElementById("products");
let cart = {};
let index = 0;

sections.forEach(section=>{
  container.innerHTML += `<div class="section"><h2>${section.title}</h2><div class="grid">`;
  section.items.forEach(item=>{
    let imgUrl = item[2];
    container.innerHTML += `
      <div class="card">
        <img src="${imgUrl}" alt="${item[0]}">
        <h3>${item[0]}</h3>
        <div class="price">LKR ${item[1]}</div>
        <div class="counter">
          <button onclick="change(${index},-1)">-</button>
          <span id="q${index}">0</span>
          <button onclick="change(${index},1)">+</button>
        </div>
      </div>
    `;
    cart[index]=0;
    index++;
  });
  container.innerHTML += `</div></div>`;
});

function change(i,val){
  let q=document.getElementById("q"+i);
  let qty=parseInt(q.innerText);
  qty+=val;
  if(qty<0) qty=0;
  q.innerText=qty;
  cart[i]=qty;
  updateTotal();
}

function updateTotal(){
  let total=0;
  let i=0;
  sections.forEach(section=>{
    section.items.forEach(item=>{
      total += cart[i]*item[1];
      i++;
    });
  });
  document.getElementById("total").innerText="Total: "+total+" LKR";
}

function goCheckout(){
  let hasItem = false;
  for(let i in cart){
    if(cart[i] > 0){
      hasItem = true;
      break;
    }
  }
  if(!hasItem){
    alert("Please select top up pack!");
    return;
  }
  localStorage.setItem("cart",JSON.stringify(cart));
  localStorage.setItem("items",JSON.stringify(sections.flatMap(section => section.items)));
  location.href="checkout.html";
}
</script>

</body>
</html>
